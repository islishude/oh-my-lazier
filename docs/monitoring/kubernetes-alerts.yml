# Template: replace namespace, service, and endpoint selectors with the expected target.
# Do not load unchanged; create one missing-target rule per expected deployment.
groups:
  - name: laz.worker.scrape
    rules:
      - alert: LazWorkerScrapeFailed
        expr: up{namespace="replace-me-namespace",service="replace-me-service",endpoint="metrics"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: LayerZero worker metrics scrape is failing
          runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/kubernetes-monitoring.md
      - alert: LazWorkerTargetMissing
        expr: absent(up{namespace="replace-me-namespace",service="replace-me-service",endpoint="metrics"})
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Expected LayerZero worker metrics target is missing
          runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/kubernetes-monitoring.md
