rule_files:
  - prometheus-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'laz_tx_recovery_blocked_age_seconds{chain_eid="30361",signer="worker",reason="fee_cap"}'
        values: "0+60x16 stale"
      - series: 'laz_tx_recovery_inflight{chain_eid="30361",signer="worker"}'
        values: "8+0x16 0"
      - series: 'laz_tx_recovery_nonce_stall_seconds{chain_eid="30361",signer="worker"}'
        values: "0+60x16 0"
    alert_rule_test:
      - eval_time: 4m
        alertname: LazTxFeeCap
        exp_alerts: []
      - eval_time: 5m
        alertname: LazTxFeeCap
        exp_alerts:
          - exp_labels:
              {
                chain_eid: "30361",
                signer: worker,
                reason: fee_cap,
                severity: warning,
              }
            exp_annotations:
              summary: Transaction recovery exceeds configured fee limits
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 15m
        alertname: LazTxRecoveryBlocked
        exp_alerts:
          - exp_labels:
              {
                chain_eid: "30361",
                signer: worker,
                reason: fee_cap,
                severity: page,
              }
            exp_annotations:
              summary: Transaction recovery requires operator attention
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 15m
        alertname: LazTxNonceStalled
        exp_alerts:
          - exp_labels: { chain_eid: "30361", signer: worker, severity: page }
            exp_annotations:
              summary: Signer nonce has not advanced for fifteen minutes
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 17m
        alertname: LazTxRecoveryBlocked
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'laz_tx_recovery_blocked_age_seconds{chain_eid="30361",signer="worker",reason="replacement_exhausted"}'
        values: "0 stale"
    alert_rule_test:
      - eval_time: 0m
        alertname: LazTxRecoveryBlocked
        exp_alerts:
          - exp_labels:
              {
                chain_eid: "30361",
                signer: worker,
                reason: replacement_exhausted,
                severity: page,
              }
            exp_annotations:
              summary: Transaction recovery requires operator attention
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 1m
        alertname: LazTxRecoveryBlocked
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'laz_tx_recovery_unseen{chain_eid="30361",signer="worker"}'
        values: "1+0x5 0"
      - series: 'laz_tx_recovery_head_age_seconds{chain_eid="30361",signer="worker"}'
        values: "0+60x6"
    alert_rule_test:
      - eval_time: 4m
        alertname: LazTxUnseen
        exp_alerts: []
      - eval_time: 5m
        alertname: LazTxUnseen
        exp_alerts:
          - exp_labels:
              { chain_eid: "30361", signer: worker, severity: warning }
            exp_annotations:
              summary: Accepted transaction is repeatedly absent from RPC providers
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 6m
        alertname: LazTxUnseen
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'laz_tx_recovery_unseen{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "1 1 0"
      - series: 'laz_tx_recovery_unseen{chain_eid="30361",signer="worker",job="worker",instance="b",cluster="primary"}'
        values: "0 0 0"
      - series: 'laz_tx_recovery_head_age_seconds{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "100 300 360"
      - series: 'laz_tx_recovery_head_age_seconds{chain_eid="30361",signer="worker",job="worker",instance="b",cluster="primary"}'
        values: "600 660 720"
      - series: 'laz_tx_recovery_nonce_stall_seconds{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "900 960 0"
      - series: 'laz_tx_recovery_nonce_stall_seconds{chain_eid="30361",signer="worker",job="worker",instance="b",cluster="primary"}'
        values: "0 0 0"
      - series: 'laz_tx_recovery_inflight{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "0 1 0"
      - series: 'laz_tx_recovery_inflight{chain_eid="30361",signer="worker",job="worker",instance="b",cluster="primary"}'
        values: "1 1 1"
    alert_rule_test:
      - eval_time: 0m
        alertname: LazTxUnseen
        exp_alerts: []
      - eval_time: 1m
        alertname: LazTxUnseen
        exp_alerts:
          - exp_labels:
              {
                chain_eid: "30361",
                signer: "worker",
                job: "worker",
                instance: "a",
                cluster: "primary",
                severity: "warning",
              }
            exp_annotations:
              summary: Accepted transaction is repeatedly absent from RPC providers
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 2m
        alertname: LazTxUnseen
        exp_alerts: []
      - eval_time: 0m
        alertname: LazTxNonceStalled
        exp_alerts: []
      - eval_time: 1m
        alertname: LazTxNonceStalled
        exp_alerts:
          - exp_labels:
              {
                chain_eid: "30361",
                signer: "worker",
                job: "worker",
                instance: "a",
                cluster: "primary",
                severity: "page",
              }
            exp_annotations:
              summary: Signer nonce has not advanced for fifteen minutes
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 2m
        alertname: LazTxNonceStalled
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'laz_tx_recovery_unseen{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "1 1 0"
      - series: 'laz_tx_recovery_unseen{chain_eid="30361",signer="worker",job="other-worker",instance="a",cluster="primary"}'
        values: "0 0 0"
      - series: 'laz_tx_recovery_head_age_seconds{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "100 300 360"
      - series: 'laz_tx_recovery_head_age_seconds{chain_eid="30361",signer="worker",job="other-worker",instance="a",cluster="primary"}'
        values: "600 660 720"
      - series: 'laz_tx_recovery_nonce_stall_seconds{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "900 960 0"
      - series: 'laz_tx_recovery_nonce_stall_seconds{chain_eid="30361",signer="worker",job="other-worker",instance="a",cluster="primary"}'
        values: "0 0 0"
      - series: 'laz_tx_recovery_inflight{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "0 1 0"
      - series: 'laz_tx_recovery_inflight{chain_eid="30361",signer="worker",job="other-worker",instance="a",cluster="primary"}'
        values: "1 1 1"
    alert_rule_test:
      - eval_time: 0m
        alertname: LazTxUnseen
        exp_alerts: []
      - eval_time: 1m
        alertname: LazTxUnseen
        exp_alerts:
          - exp_labels:
              {
                chain_eid: "30361",
                signer: "worker",
                job: "worker",
                instance: "a",
                cluster: "primary",
                severity: "warning",
              }
            exp_annotations:
              summary: Accepted transaction is repeatedly absent from RPC providers
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 2m
        alertname: LazTxUnseen
        exp_alerts: []
      - eval_time: 0m
        alertname: LazTxNonceStalled
        exp_alerts: []
      - eval_time: 1m
        alertname: LazTxNonceStalled
        exp_alerts:
          - exp_labels:
              {
                chain_eid: "30361",
                signer: "worker",
                job: "worker",
                instance: "a",
                cluster: "primary",
                severity: "page",
              }
            exp_annotations:
              summary: Signer nonce has not advanced for fifteen minutes
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 2m
        alertname: LazTxNonceStalled
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'laz_tx_recovery_unseen{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "1 1 0"
      - series: 'laz_tx_recovery_unseen{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="other-cluster"}'
        values: "0 0 0"
      - series: 'laz_tx_recovery_head_age_seconds{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "100 300 360"
      - series: 'laz_tx_recovery_head_age_seconds{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="other-cluster"}'
        values: "600 660 720"
      - series: 'laz_tx_recovery_nonce_stall_seconds{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "900 960 0"
      - series: 'laz_tx_recovery_nonce_stall_seconds{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="other-cluster"}'
        values: "0 0 0"
      - series: 'laz_tx_recovery_inflight{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: "0 1 0"
      - series: 'laz_tx_recovery_inflight{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="other-cluster"}'
        values: "1 1 1"
    alert_rule_test:
      - eval_time: 0m
        alertname: LazTxUnseen
        exp_alerts: []
      - eval_time: 1m
        alertname: LazTxUnseen
        exp_alerts:
          - exp_labels:
              {
                chain_eid: "30361",
                signer: "worker",
                job: "worker",
                instance: "a",
                cluster: "primary",
                severity: "warning",
              }
            exp_annotations:
              summary: Accepted transaction is repeatedly absent from RPC providers
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 2m
        alertname: LazTxUnseen
        exp_alerts: []
      - eval_time: 0m
        alertname: LazTxNonceStalled
        exp_alerts: []
      - eval_time: 1m
        alertname: LazTxNonceStalled
        exp_alerts:
          - exp_labels:
              {
                chain_eid: "30361",
                signer: "worker",
                job: "worker",
                instance: "a",
                cluster: "primary",
                severity: "page",
              }
            exp_annotations:
              summary: Signer nonce has not advanced for fifteen minutes
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 2m
        alertname: LazTxNonceStalled
        exp_alerts: []
  # An isolated failure, a first visible nonzero counter, and failures spread
  # across different scrape instances must not trigger the source warning.
  - interval: 1m
    input_series:
      - series: 'laz_pricing_source_failures_total{eid="30361",source="coingecko",role="primary",category="stale",instance="a"}'
        values: "0+0x14 1+0x75"
      - series: 'laz_pricing_source_failures_total{eid="30361",source="coingecko",role="primary",category="stale",instance="b"}'
        values: "0+0x14 1+0x75"
      - series: 'laz_pricing_source_failures_total{eid="30361",source="chainlink",role="sanity",category="timeout",instance="a"}'
        values: "1+0x90"
    alert_rule_test:
      - eval_time: 0m
        alertname: LazPricingSourceFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: LazPricingSourceFailing
        exp_alerts: []
      - eval_time: 90m
        alertname: LazPricingSourceFailing
        exp_alerts: []
  # Two observed increases fire without a hold time, then age out of the window.
  - interval: 1m
    input_series:
      - series: 'laz_pricing_source_failures_total{eid="30361",source="coingecko",role="primary",category="stale",instance="a",job="worker"}'
        values: "0+0x14 1+0x14 2+0x60"
    alert_rule_test:
      - eval_time: 29m
        alertname: LazPricingSourceFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: LazPricingSourceFailing
        exp_alerts:
          - exp_labels:
              eid: "30361"
              source: coingecko
              role: primary
              category: stale
              instance: a
              job: worker
              severity: warning
            exp_annotations:
              summary: Pricing source has repeatedly rejected observations in the last hour
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 90m
        alertname: LazPricingSourceFailing
        exp_alerts: []
  # A restart resets the counter; increases on both sides still count.
  - interval: 1m
    input_series:
      - series: 'laz_pricing_source_failures_total{eid="30361",source="chainlink",role="sanity",category="timeout",instance="a"}'
        values: "0+0x14 1+0x14 0+0x14 1+0x45"
    alert_rule_test:
      - eval_time: 30m
        alertname: LazPricingSourceFailing
        exp_alerts: []
      - eval_time: 45m
        alertname: LazPricingSourceFailing
        exp_alerts:
          - exp_labels:
              eid: "30361"
              source: chainlink
              role: sanity
              category: timeout
              instance: a
              severity: warning
            exp_annotations:
              summary: Pricing source has repeatedly rejected observations in the last hour
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1h
        alertname: LazPricingSourceFailing
        exp_alerts: []
