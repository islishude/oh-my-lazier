        exp_alerts:
          - exp_labels: {chain_eid: '30361', signer: 'worker', job: 'worker', instance: 'a', cluster: 'primary', severity: 'page'}
            exp_annotations:
              summary: Signer nonce has not advanced for fifteen minutes
              runbook: docs/runbooks/monitoring.md
      - eval_time: 2m
