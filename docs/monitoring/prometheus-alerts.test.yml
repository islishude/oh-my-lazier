      - series: 'laz_tx_recovery_nonce_stall_seconds{chain_eid="30361",signer="worker",job="other-worker",instance="a",cluster="primary"}'
        values: '0 0 0'
      - series: 'laz_tx_recovery_inflight{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
