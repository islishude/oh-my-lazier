        values: '0 0 0'
      - series: 'laz_tx_recovery_inflight{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="primary"}'
        values: '0 1 0'
      - series: 'laz_tx_recovery_inflight{chain_eid="30361",signer="worker",job="worker",instance="a",cluster="other-cluster"}'
        values: '1 1 1'
    alert_rule_test:
      - eval_time: 0m
