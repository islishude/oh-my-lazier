  - name: environmental broadcast recovery and exhaustion
    interval: 1m
    input_series:
      - series: 'laz_chain_enabled{eid="30151"}'
        values: '1+0x8'
      - series: 'laz_tx_outbox_held_oldest_age_seconds{chain_eid="30151",signer="worker",reason="broadcast_retrying"}'
        values: '0 60 120 180 240 300 360 stale'
      - series: 'laz_tx_outbox_held_total{chain_eid="30151",signer="worker",reason="broadcast_exhausted"}'
        values: '0 0 0 0 0 0 0 1 stale'
    alert_rule_test:
      - eval_time: 5m
        alertname: LazTxBroadcastRetrying
        exp_alerts: []
      - eval_time: 6m
        alertname: LazTxBroadcastRetrying
        exp_alerts:
          - exp_labels:
              chain_eid: '30151'
              signer: worker
              reason: broadcast_retrying
              severity: warning
            exp_annotations:
              summary: Environmental transaction recovery is retrying; check RPC availability and signer balance
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 7m
        alertname: LazTxBroadcastRetrying
        exp_alerts: []
      - eval_time: 6m
        alertname: LazTxBroadcastExhausted
        exp_alerts: []
      - eval_time: 7m
        alertname: LazTxBroadcastExhausted
        exp_alerts:
          - exp_labels:
              chain_eid: '30151'
              signer: worker
              reason: broadcast_exhausted
              severity: page
            exp_annotations:
              summary: Broadcast recovery requires operator action; inspect RPC errors, balance and retry budgets before replace or cancel
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 8m
        alertname: LazTxBroadcastExhausted
        exp_alerts: []

  - name: broadcast alerts follow chain enablement per worker
    interval: 1m
    input_series:
      - series: 'laz_chain_enabled{eid="49999",chain_name="retired",job="worker",instance="a"}'
        values: '1 0 0 1'
      # An enabled copy on another scrape target must not unmute instance a.
      - series: 'laz_chain_enabled{eid="49999",chain_name="retired",job="worker",instance="b"}'
        values: '1+0x3'
      - series: 'laz_tx_outbox_held_total{chain_eid="49999",chain_name="retired",signer="worker",reason="broadcast_exhausted",job="worker",instance="a"}'
        values: '1+0x3'
      - series: 'laz_tx_outbox_held_oldest_age_seconds{chain_eid="49999",chain_name="retired",signer="worker",reason="broadcast_retrying",job="worker",instance="a"}'
        values: '600+60x3'
    alert_rule_test:
      - eval_time: 0m
        alertname: LazTxBroadcastExhausted
        exp_alerts:
          - exp_labels:
              chain_eid: '49999'
              chain_name: retired
              signer: worker
              reason: broadcast_exhausted
              job: worker
              instance: a
              severity: page
            exp_annotations:
              summary: Broadcast recovery requires operator action; inspect RPC errors, balance and retry budgets before replace or cancel
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 0m
        alertname: LazTxBroadcastRetrying
        exp_alerts:
          - exp_labels:
              chain_eid: '49999'
              chain_name: retired
              signer: worker
              reason: broadcast_retrying
              job: worker
              instance: a
              severity: warning
            exp_annotations:
              summary: Environmental transaction recovery is retrying; check RPC availability and signer balance
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 1m
        alertname: LazTxBroadcastExhausted
        exp_alerts: []
      - eval_time: 1m
        alertname: LazTxBroadcastRetrying
        exp_alerts: []
      - eval_time: 2m
        alertname: LazTxBroadcastExhausted
        exp_alerts: []
      - eval_time: 2m
        alertname: LazTxBroadcastRetrying
        exp_alerts: []
      - eval_time: 3m
        alertname: LazTxBroadcastExhausted
        exp_alerts:
          - exp_labels:
              chain_eid: '49999'
              chain_name: retired
              signer: worker
              reason: broadcast_exhausted
              job: worker
              instance: a
              severity: page
            exp_annotations:
              summary: Broadcast recovery requires operator action; inspect RPC errors, balance and retry budgets before replace or cancel
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
      - eval_time: 3m
        alertname: LazTxBroadcastRetrying
        exp_alerts:
          - exp_labels:
              chain_eid: '49999'
              chain_name: retired
              signer: worker
              reason: broadcast_retrying
              job: worker
              instance: a
              severity: warning
            exp_annotations:
              summary: Environmental transaction recovery is retrying; check RPC availability and signer balance
              runbook: https://github.com/islishude/oh-my-lazier/blob/main/docs/runbooks/monitoring.md
